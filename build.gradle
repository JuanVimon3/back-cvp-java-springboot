plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3' // Ajustado a la versión estable actual
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.compraventap'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // Persistencia Relacional y NoSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    
    // Web y Seguridad
    implementation 'org.springframework.boot:spring-boot-starter-web' // Corregido: nombre oficial de la dependencia web
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // Lombok (Desarrollo y Pruebas)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    
    // Motores de Base de Datos
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    
    // El Starter de Pruebas Definitivo (Incluye JUnit 5 y Mockito automáticamente)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Librerías para manejar JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
    useJUnitPlatform()
}

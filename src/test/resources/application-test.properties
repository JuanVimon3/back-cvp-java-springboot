# Desactivar inicializaciones reales de bases de datos relacionales en tests de integración
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Desactivar conexión real a MongoDB remoto (usa una base de datos local en memoria ficticia)
spring.data.mongodb.uri=mongodb://localhost:27017/testdb

# Definición explícita de placeholders problemáticos para que no saquen PlaceholderResolutionException
